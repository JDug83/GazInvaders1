<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GazInvaders</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .middle {
            text-align: center;
        }

        h1 {
            margin-top: 40px;
        }

        /* Button-17 Styles */
        .button-17 {
            align-items: center;
            appearance: none;
            background-color: #fff;
            border-radius: 24px;
            border-style: none;
            box-shadow: rgba(0, 0, 0, .2) 0 3px 5px -1px, rgba(0, 0, 0, .14) 0 6px 10px 0, rgba(0, 0, 0, .12) 0 1px 18px 0;
            box-sizing: border-box;
            color: #3c4043;
            cursor: pointer;
            display: inline-flex;
            text-decoration: none; /* Removes link underline */
            font-family: "Google Sans", Roboto, Arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            height: 48px;
            justify-content: center;
            letter-spacing: .25px;
            line-height: normal;
            max-width: 100%;
            padding: 2px 28px;
            margin-top: 180px; /* Positions the button down the page */
            position: relative;
            text-align: center;
            transition: box-shadow 280ms cubic-bezier(.4, 0, .2, 1), transform 270ms cubic-bezier(0, 0, .2, 1);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .button-17:hover {
            background: #F6F9FE;
            color: #174ea6;
            box-shadow: rgba(60, 64, 67, .3) 0 2px 3px 0, rgba(60, 64, 67, .15) 0 6px 10px 4px;
        }

        .button-17:active {
            box-shadow: 0 4px 4px 0 rgb(60 64 67 / 30%), 0 8px 12px 6px rgb(60 64 67 / 15%);
            transform: scale(0.98);
            outline: none;
        }

        .button-17:focus {
            outline: none;
            border: 2px solid #4285f4;
        }
    </style>
</head>
<body>

    <div class="middle">
        <h1>GazInvaders</h1>
        <!-- Styled link pointing cleanly to Game.html -->
        <a href="Game.html" class="button-17" role="button">Play Now!</a>
    </div>

</body>
</html>
